name: Gamma BETA validation

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'readme.md'
      - 'AGENTS.md'
      - 'LICENSES/**'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamma-beta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IDF_IMAGE: espressif/idf:v6.0.2@sha256:0d8c9773d48a327233f9c1d7c654ff0bcf133ae24503ea2e97a57cfe02b8cb67
  FW_BUILD_DIR: build/gamma-public

jobs:
  gamma:
    name: Gamma 601/602 paired OTA BETA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source and pinned submodule
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Reserve hosted runner space for the pinned SDK
        run: |
          # This job uses a fresh GitHub-hosted VM. These unrelated SDKs are
          # rebuildable runner image contents; no Docker images are removed.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /
          available_kib=$(df -Pk / | awk 'NR==2 {print $4}')
          test "$available_kib" -ge 25165824

      - name: Set up pinned Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: main/http_server/axe-os/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check beta version and browser
        run: |
          node -e 'const fs=require("fs"); const v=fs.readFileSync("version.txt","utf8").trim(); if (!/^5tratumFW-\d+\.\d+\.\d+-beta\.\d+$/.test(v) || Buffer.byteLength(v)>31) throw new Error("Expected a named 5tratumFW BETA version that fits the app descriptor"); if (process.version!=="v24.14.0") throw new Error("Unexpected Node version");'
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          test -n "$(command -v google-chrome)"

      - name: Build compressed web interface and run frontend tests
        working-directory: main/http_server/axe-os
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run test:ci

      - name: Run Gamma host regression tests
        run: |
          python3 tools/test_gamma_host.py
          python3 tools/test_ca_bundle.py

      - name: Check actual compressed web payload
        run: python3 tools/check_web_budget.py --report artifacts/web-budget.json

      - name: Compile ESP32-S3 application and WWW partition
        run: |
          test ! -e "$FW_BUILD_DIR"
          mkdir -p "$FW_BUILD_DIR"
          cp artifacts/web-budget.json "$FW_BUILD_DIR/web-budget.json"
          git rev-parse HEAD > "$FW_BUILD_DIR/build-source-commit.txt"
          docker run --rm -i -e GITHUB_ACTIONS=true -e FW_BUILD_DIR -e FW_IDF_IMAGE="$IDF_IMAGE" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/project" -w /project \
            "$IDF_IMAGE" bash -eu <<'BUILD'
          git config --global --add safe.directory /project
          test "$(idf.py --version)" = "ESP-IDF v6.0.2"
          idf.py -B "$FW_BUILD_DIR" -D SDKCONFIG="/project/$FW_BUILD_DIR/sdkconfig" -D IDF_TARGET=esp32s3 build
          python tools/test_ca_bundle.py --build-dir "$FW_BUILD_DIR"
          python - "$FW_BUILD_DIR" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          receipt = {"idf_version": "v6.0.2", "container_image": os.environ["FW_IDF_IMAGE"],
                     "idf_source": {"repository": "https://github.com/espressif/esp-idf",
                                    "commit": subprocess.check_output(["git", "-C", os.environ["IDF_PATH"], "rev-parse", "HEAD"], text=True).strip()}}
          (Path(sys.argv[1]) / "build-toolchain.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
          BUILD

      - name: Render production OLED layout with native LVGL
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 test/host/render_oled_native.py

      - name: Verify and package paired OTA BETA images and source
        run: python3 tools/package_5tratumfw.py --build-dir "$FW_BUILD_DIR"

      - name: Save verified BETA package
        uses: actions/upload-artifact@v4
        with:
          name: 5tratumFW-Gamma-BETA-${{ github.sha }}
          path: artifacts/5tratumFW-*-beta.*/
          if-no-files-found: error
          retention-days: 30

      - name: Save frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results-${{ github.sha }}
          path: main/http_server/axe-os/report.xml
          if-no-files-found: ignore

      - name: Save native OLED fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oled-native-fixtures-${{ github.sha }}
          path: |
            .cache/oled-native/output/*.png
            .cache/oled-native/output/oled-native-report.json
          include-hidden-files: true
          if-no-files-found: ignore

# This workflow builds reviewable artifacts only. A maintainer may publish a
# GitHub prerelease after reviewing its validation and hardware-test record.
# It never generates factory/NVS images, flashes miners, or publishes a stable release.
