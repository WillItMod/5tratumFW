<header class="fw-config-heading"><h1>Scheduler</h1></header>
<section class="fw-control-console fw-scheduler-console" aria-label="Mining schedule and power control">
  <nav class="fw-control-sections" aria-label="Scheduler sections"><button type="button" (click)="selectSection('power')" [class.fw-section-active]="section === 'power'">Power schedule</button><button type="button" (click)="selectSection('tuning')" [class.fw-section-active]="section === 'tuning'">Tuning schedule</button><button type="button" (click)="selectSection('pool')" [class.fw-section-active]="section === 'pool'">Pool schedule</button></nav>
  <app-mining-controls *ngIf="section === 'power'"></app-mining-controls>
  <app-pool-schedule *ngIf="section === 'pool'"></app-pool-schedule>
  <app-tuning-schedule *ngIf="section === 'tuning'"></app-tuning-schedule>
</section>
