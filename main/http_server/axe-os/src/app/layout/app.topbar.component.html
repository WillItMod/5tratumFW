<div class="layout-topbar fw-masthead">
  <a routerLink="/" class="fw-brand" aria-label="5tratumFW overview"><img src="assets/5tratum-emblem.png" width="46" height="46" alt="5tratumOS" /><span>5tratum<b>FW</b></span></a>
  <ng-container *ngIf="info$ | async as info">
    <div class="fw-masthead-device"><span>{{info.hostname}}</span><small>{{info.ASICModel}} <span>·</span> {{info.boardVersion}}</small></div>
    <div *ngIf="!isAPMode" class="fw-masthead-actions">
      <button type="button" class="fw-command-action fw-privacy-action" [attr.aria-label]="sensitiveDataHidden ? 'Show sensitive data' : 'Hide sensitive data'" (click)="toggleSensitiveData()" pTooltip="Sensitive data {{sensitiveDataHidden ? 'hidden' : 'visible'}}"><i class="pi" [ngClass]="sensitiveDataHidden ? 'pi-eye-slash' : 'pi-eye'" aria-hidden="true"></i></button>
      <a routerLink="/network" class="fw-command-action fw-network-action" aria-label="Network connection" pTooltip="Wi-Fi RSSI: {{info.wifiRSSI}} dBm"><wifi-icon [rssi]="info.wifiRSSI" /></a>
      <button type="button" class="fw-command-action" (click)="toggleMiningPaused()" [disabled]="miningActionDisabled" [attr.aria-label]="miningActionText + ' mining'" [pTooltip]="miningActionDescription"><i class="pi" [ngClass]="isMiningPaused ? 'pi-play' : 'pi-pause'" aria-hidden="true"></i><span>{{miningActionText}}</span></button>
      <button type="button" class="fw-command-action" (click)="restart()" aria-label="Restart device"><i class="pi pi-refresh" aria-hidden="true"></i><span>Restart</span></button>
    </div>
  </ng-container>
  <button *ngIf="!isAPMode" #menubutton type="button" class="fw-menu-toggle" aria-label="Toggle navigation" [attr.aria-expanded]="layoutService.state.staticMenuMobileActive" (click)="layoutService.onMenuToggle()"><i class="pi" [ngClass]="layoutService.state.staticMenuMobileActive ? 'pi-times' : 'pi-bars'" aria-hidden="true"></i><span>Menu</span></button>
</div>
